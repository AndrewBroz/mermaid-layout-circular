name: pages

# Builds the demo gallery and deploys it to GitHub Pages on every
# push to main. Repo setting required once: Pages → Source →
# GitHub Actions.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
      - id: deployment
        uses: actions/deploy-pages@v4
