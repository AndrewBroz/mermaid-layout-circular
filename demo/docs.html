<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>mermaid-layout-circular — README picture</title>
    <style>
      /* One case on a white card, for scripts/render-docs.mjs. The page
         stays transparent, so the card's rounded corners do too. */
      html,
      body {
        margin: 0;
        background: transparent;
      }
      #shot {
        display: inline-block;
        padding: 16px;
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 8px;
      }
      #shot svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="shot"></div>
    <script type="module" src="./docs.ts"></script>
  </body>
</html>
