<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mermaid-layout-circular — playground</title>
    <meta
      name="description"
      content="Try the circular layout for mermaid flowcharts: pick an example, edit it, and switch its settings."
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #23272e;
        --paper: #fbfaf7;
        --line: #d8d4cb;
        --muted: #6b6a66;
        --error: #a33;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.5rem 2rem 2rem;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.25rem 1.5rem;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: normal;
        margin: 0;
      }
      h1 span {
        font-style: italic;
        opacity: 0.7;
      }
      nav {
        display: flex;
        gap: 1rem;
        font-size: 0.9rem;
      }
      a {
        color: inherit;
      }
      .versions {
        margin-left: auto;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem 1.5rem;
        margin-bottom: 1rem;
        font-size: 0.95rem;
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        white-space: nowrap;
      }
      .controls label.disabled {
        opacity: 0.45;
      }
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      select {
        padding: 0.2rem 0.3rem;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: white;
      }
      code {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.8em;
        color: var(--muted);
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
        gap: 1.5rem;
      }
      textarea {
        width: 100%;
        min-height: 70vh;
        padding: 0.75rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.85rem;
        line-height: 1.45;
        resize: vertical;
        tab-size: 2;
      }
      .preview {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        padding: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
      }
      .preview svg {
        max-width: 100%;
        height: auto;
      }
      .error {
        color: var(--error);
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
      }
      @media (max-width: 760px) {
        body {
          padding: 1rem;
        }
        main {
          grid-template-columns: minmax(0, 1fr);
        }
        textarea {
          min-height: 16rem;
        }
        .preview {
          min-height: 20rem;
        }
        .versions {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>mermaid-layout-circular <span>playground</span></h1>
      <nav>
        <a href="https://github.com/AndrewBroz/mermaid-layout-circular#readme">README</a>
        <a href="gallery.html">Gallery</a>
        <a href="https://www.npmjs.com/package/mermaid-layout-circular">npm</a>
      </nav>
      <span class="versions" id="versions"></span>
    </header>
    <div class="controls">
      <label>Example <select id="example"></select></label>
      <label><input type="checkbox" id="circular" /> Circular <code id="layout-line">layout: circular</code></label>
      <label>
        <select id="direction" aria-label="Direction">
          <option value="circular">Clockwise</option>
          <option value="circular-ccw">Counter-clockwise</option>
        </select>
      </label>
      <label><input type="checkbox" id="straight" /> Straight edges <code>curve: linear</code></label>
      <label><input type="checkbox" id="hand-drawn" /> Hand-drawn <code>look: handDrawn</code></label>
    </div>
    <main>
      <textarea
        id="editor"
        aria-label="Diagram text"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        wrap="off"
      ></textarea>
      <div class="preview" id="preview" aria-live="polite"></div>
    </main>
    <script type="module" src="./playground.ts"></script>
  </body>
</html>
